# --- Window Settings ---
# Matches your transparent aesthetic
background_opacity 0.85
dynamic_background_opacity yes

# Padding (x = 12, y = 12)
window_padding_width 12

# --- Font Settings ---
font_size 11.0

font_family      Inter
bold_font        Inter Bold
italic_font      Inter Italic
bold_italic_font auto

# --- Color Palette (Orchis Dark / Sweet aesthetic) ---
# Primary
background #1e1e2e
foreground #cdd6f4

# Cursor
cursor_text_color #1e1e2e
cursor            #f5e0dc

# Normal colors (0-7)
color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de

# Bright colors (8-15)
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8